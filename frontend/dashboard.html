<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C3E70" />
    <title>Trang chủ | EduManager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              wine: "#132D55",
              berry: "#0A122A",
              oat: "#FFECD1",
              paper: "#FFECD1",
              panel: "#FFF8E8",
              blush: "#F3C4CC",
              ink: "#132D55",
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"],
            },
          },
        },
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-oat text-ink antialiased">
    <main
      id="dashboard"
      class="page-enter flex min-h-screen flex-col px-5 py-6 sm:px-10"
    >
      <header class="flex items-center justify-between gap-3">
        <span class="text-lg font-extrabold text-wine">EduManager</span>
        <div class="flex items-center gap-2">
          <button
            id="theme-toggle"
            type="button"
            aria-label="Chuyển giao diện tối"
            title="Chuyển giao diện tối"
            class="flex size-10 items-center justify-center rounded-lg text-wine/70 transition hover:bg-wine/[0.06] hover:text-wine"
          >
            <i data-lucide="moon" class="size-[18px]" aria-hidden="true"></i>
          </button>
          <button
            type="button"
            data-nav="logout"
            class="flex h-10 items-center gap-2 rounded-lg bg-wine px-4 text-sm font-bold text-paper transition hover:bg-[#0E2446]"
          >
            <i data-lucide="log-out" class="size-4" aria-hidden="true"></i>
            Đăng xuất
          </button>
        </div>
      </header>

      <section class="flex flex-1 items-center justify-center py-10">
        <div
          class="form-enter w-full max-w-[496px] rounded-2xl bg-panel p-8 shadow-[0_5px_14px_rgba(19,45,85,0.10)]"
        >
          <p class="text-xs font-bold uppercase tracking-wider text-berry/60">
            Đăng nhập thành công
          </p>
          <h1 class="mt-2 text-2xl font-extrabold text-wine">
            Xin chào, <span id="user-name"></span>
          </h1>
          <dl class="mt-6 space-y-3 text-sm">
            <div class="flex justify-between gap-3">
              <dt class="text-wine/60">Vai trò</dt>
              <dd id="user-role" class="font-bold text-berry"></dd>
            </div>
            <div class="flex justify-between gap-3">
              <dt class="text-wine/60">Email</dt>
              <dd id="user-email" class="font-semibold"></dd>
            </div>
          </dl>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
