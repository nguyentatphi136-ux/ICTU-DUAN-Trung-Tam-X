<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lỗi hệ thống</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #f4f7ff;
      --bg-2: #eef2ff;
      --card: rgba(255, 255, 255, 0.9);
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .error-card {
      width: min(100%, 620px);
      background: var(--card);
      border: 1px solid rgba(37, 99, 235, 0.08);
      border-radius: 24px;
      box-shadow: 0 22px 60px rgba(37, 99, 235, 0.10);
      padding: 40px 30px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .error-code {
      font-size: clamp(4rem, 9vw, 8rem);
      font-weight: 800;
      line-height: 1;
      color: var(--danger);
      margin: 0;
      letter-spacing: -0.08em;
    }

    .error-title {
      margin-top: 18px;
      margin-bottom: 12px;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 800;
      color: var(--text);
    }

    .error-message {
      margin: 0 auto;
      max-width: 520px;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.7;
    }

    .divider {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 28px 0;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      border-radius: 12px;
      font-weight: 600;
      padding: 0.8rem 1.5rem;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .btn-outline-secondary,
    .btn-outline-danger {
      border-width: 1.5px;
    }

    .btn-outline-danger {
      color: var(--danger);
      border-color: rgba(220, 38, 38, 0.5);
    }

    .btn-outline-danger:hover {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: var(--danger);
    }

    .error-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--danger-soft);
      color: var(--danger);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-card">
      <div class="error-badge">System error</div>
      <h1 class="error-code" id="errorCode">403</h1>
      <h3 class="error-title" id="errorTitle">Truy cập bị từ chối</h3>
      <p class="error-message" id="errorMessage">
        Bạn không có quyền truy cập vào tài nguyên này. Vui lòng liên hệ Quản trị viên nếu đây là sự nhầm lẫn.
      </p>

      <hr class="divider" />

      <div class="actions">
        <a href="/home" class="btn btn-primary">Về trang chủ</a>
        <button type="button" class="btn btn-outline-secondary" onclick="history.back()">Quay lại</button>
        <a href="/login.html" class="btn btn-outline-danger">Đăng nhập lại</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code') || '403';

      const errorCode = document.getElementById('errorCode');
      const errorTitle = document.getElementById('errorTitle');
      const errorMessage = document.getElementById('errorMessage');

      if (code === '404') {
        errorCode.textContent = '404';
        errorTitle.textContent = 'Trang không tồn tại';
        errorMessage.textContent = 'Địa chỉ URL bạn truy cập không tồn tại hoặc đã bị di chuyển.';
      } else if (code === '500') {
        errorCode.textContent = '500';
        errorTitle.textContent = 'Lỗi máy chủ';
        errorMessage.textContent = 'Hệ thống đang gặp sự cố gián đoạn, vui lòng thử lại sau ít phút.';
      } else if (code === '401') {
        errorCode.textContent = '401';
        errorTitle.textContent = 'Phiên làm việc hết hạn';
        errorMessage.textContent = 'Phiên đăng nhập của bạn đã hết hạn. Vui lòng đăng nhập lại để tiếp tục.';
      }
    });
  </script>
</body>
</html>
